name: Cleanup Old News

on:
  schedule:
    - cron: '0 3 * * 0'  # Domingo às 3h
  workflow_dispatch:
    inputs:
      days:
        description: 'Dias para manter (padrão: 60)'
        required: false
        default: '60'

jobs:
  cleanup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cleanup
        run: |
          DAYS="${{ github.event.inputs.days }}"
          python main.py cleanup --days ${DAYS:-60}

      - name: Estatísticas após cleanup
        run: python main.py stats
